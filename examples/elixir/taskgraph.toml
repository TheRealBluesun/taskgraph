# taskgraph.toml — the Elixir project (SPEC §1).
#
# This is the whole project-specific surface: taskgraph itself is project-agnostic.
# Copy it to the project root (`cp examples/elixir/taskgraph.toml .`) and edit.

plan = "PLAN.md"                            # task list, one `- [ ] ID text [deps: …]` per line (SPEC §2)
prompt = "PROMPT.md"                        # general agent instructions, prepended with each task header (SPEC §6)
gate = "./dev.sh build && ./dev.sh test"    # must pass in the rebased worktree before a merge (SPEC §8)
worktrees = "../elixir-wt"                  # worktree base dir, relative to this project root (a sibling of the checkout)
main = "main"                               # integration branch: task branches are cut from it and fast-forwarded into it
links = [".env"]                            # files symlinked into each new worktree (secrets: linked, never copied)

# How each coding agent is launched and watched (SPEC §6). A `deny` entry gets a shim first on the
# agent's PATH: outside a lease it prints "run it through ./dev.sh" and exits 64, so the only way to
# touch the simulator is through a lease (SPEC §5, examples/elixir/dev-sh-lease.md).
[agent]
command = "omp -p --mode json --auto-approve --no-session --model {model} --thinking high --max-time 120m --config {overlay} @{prompt_file}"
overlay = "omp-agent.yml"                   # taskgraph's default: omp auto-background disabled (SPEC §6)
stall_secs = 480                            # no trace growth for 8 min — and no lease holder in the worktree → kill
max_lease_secs = 1800                       # a lease held longer than 30 min is reported as an `anomaly` event
retries = 2                                 # resumes after an agent exits without .done, then blocks
deny = ["xcodebuild", "xcrun"]              # one simulator: agents must go through ./dev.sh

# Watchdogs that stop a stuck agent and resume it from its worktree (SPEC §6). An agent whose last N
# tool calls are identical — same tool, same arguments — is in a degenerate loop: the trace keeps
# growing, so the stall watchdog below never fires (D5 ran the same `ls` ~12,000 times). `0` disables
# the check for a task whose work genuinely is the same call repeated.
[runner]
loop_window = 20

# Counting semaphores shared by every process on the machine (SPEC §5). Elixir has exactly one
# simulator, so capacity 1; add `build = 1` here if you also want the compile step serialized.
[resources]
simulator = 1

# Priority order: the first model with room gets a new agent, so fastest/best first, auxiliary paid
# models last (SPEC §4). sessions = concurrent agents; max_agents = agents allowed while the server's
# metrics show idle capacity (agents blocked on a build/lease do not use the GPU); metrics = vLLM
# Prometheus URL (optional, but it enables the slack rule and the idle diagnostics).
# classes splits capacity by job class (SPEC §4): plan tasks are `agent` (default = sessions); short
# jobs run `taskgraph side side -- …` and get TASKGRAPH_MODEL back, preferring a model whose agent is
# blocked on a tool. The .10 Flash KV cache fits one long-context agent — and one critic, nothing more.
[[models]]
name = "local-vllm-flash/Qwen3.8-Flash-Next"
sessions = 1                                # one long-context coding request at a time on the .10 server
max_agents = 2
metrics = "http://10.10.10.10:8000/metrics"
classes = { agent = 1, side = 1 }

[[models]]
name = "local-vllm-27b/Qwen3.8-27B"
sessions = 3                                # total generation peaks at ~3 concurrent requests on the .15 server
max_agents = 5
metrics = "http://10.10.10.15:8002/metrics"
fallback = "deepseek/deepseek-v4-flash"     # rate-limited here → restart this task on the overflow model (SPEC §6)

[[models]]
name = "deepseek/deepseek-v4-flash"         # auxiliary, paid: only when both local GPUs are full and work is waiting
sessions = 2
max_agents = 2

trailer = ["Co-authored-by: taskgraph <noreply@taskgraph>"]   # appended to every merge commit (SPEC §8)

# The request router (SPEC §11). Point every agent's OpenAI client at ONE endpoint —
# `taskgraph router` (default http://127.0.0.1:8080/v1) — and each generation request is dispatched
# to the best worker with a free slot: affinity to the worker that served this agent last (keeps the
# prefix cache warm), else config order (priority), else a FIFO wait. Request-level capacity is what
# protects a server: a second long-context request on .10 thrashes its KV cache, which is why the
# [models] counts above can be higher than `concurrency` here.
[[workers]]
name = "flash"                              # free-form; defaults to `model`
upstream = "http://10.10.10.10:8000"        # OpenAI-compatible base URL (the /v1 path is appended)
model = "local-vllm-flash/Qwen3.8-Flash-Next"   # the request's `model` field is rewritten to this
concurrency = 1                             # one long-context request at a time
max_context = 70000                         # prompts estimated above this (chars/3.5) skip this worker

[[workers]]
name = "27b"
upstream = "http://10.10.10.15:8002"
model = "local-vllm-27b/Qwen3.8-27B"
concurrency = 3                             # the .15 server peaks at ~3 concurrent requests

[[workers]]
name = "deepseek"
upstream = "https://api.deepseek.com"
model = "deepseek-v4-flash"
concurrency = 4
api_key_env = "DEEPSEEK_API_KEY"            # Authorization: Bearer $DEEPSEEK_API_KEY — never logged
overflow = true                             # paid: only used while every local worker is full
max_requests_per_hour = 60                  # required for an overflow worker: the spend cap

# Scheduler tuning (SPEC §7). When the top-priority model frees an agent slot and nothing is queued
# for it, one running agent on a lower tier that started at most this long ago is restarted there
# through the same worktree — critical path first, once per task. `0` disables upgrading.
[scheduler]
upgrade_window = "20m"

# Refuse a merge commit that looks like a build dump (SPEC §8). The defaults already block
# .build/ build/ DerivedData/ node_modules/ __pycache__/ target/ dist/.
[merge]
deny_paths = ["playtest-results"]           # the harness writes JSON here; it must never reach main
# Optional: a rebase conflict runs one short resolver agent in the worktree instead of blocking
# the task outright. The file holds the project's resolver instructions; taskgraph adds each
# conflicted hunk with both sides, the two commits' messages and the "keep both intents" rule.
# resolver_prompt = "RESOLVER.md"

# `taskgraph stats` buckets tool time by the *first* tool call's command (SPEC §9). Configured
# buckets are matched first, then the defaults (lease-wait, build, test, wait) still apply.
[stats.buckets]
playtest = 'playtest\.sh'
art = 'tools/gen(audio|art)\.py'
